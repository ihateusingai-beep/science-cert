<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣象小魔術師 - 分級證書版</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'ZCOOL+KuaiLe', cursive, system-ui, sans-serif; background-color: #f0f9ff; overflow-x: hidden; touch-action: manipulation; user-select: none; }
        #landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 3rem; border-radius: 2rem; box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3); text-align: center; border: 8px solid #7dd3fc; width: 90%; max-width: 450px; animation: bounceIn 1s; }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
        .canvas-area { height: 380px; position: relative; background: linear-gradient(to bottom, #87CEEB, #E0F2FE); border-radius: 2rem; overflow: hidden; border: 8px solid #bae6fd; transition: all 1s ease; }
        .magic-btn { transition: transform 0.1s, filter 0.2s; box-shadow: 0 6px 0 #94a3b8; }
        .magic-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #94a3b8; }
        .btn-sun { background: linear-gradient(135deg, #fef9c3 0%, #fde047 100%); border-color: #ca8a04; }
        .btn-cloud { background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); border-color: #64748b; }
        .btn-rain { background: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 100%); border-color: #0284c7; }
        .btn-snow { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border-color: #94a3b8; }
        .btn-dew { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); border-color: #d97706; }
        .btn-quiz { background: linear-gradient(135deg, #f3e8ff 0%, #c4b5fd 100%); border-color: #7c3aed; }
        #sun-obj, #cloud-obj, #puddle-obj, #ground-obj { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 4rem; transition: all 1s; }
        #cloud-obj { bottom: 80px; }
        .sun-active { animation: sunPulse 2s ease-in-out infinite; color: #facc15; }
        @keyframes sunPulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
        .cloud-active { animation: cloudFloat 3s ease-in-out infinite; }
        @keyframes cloudFloat { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
        .sound-word { position: absolute; font-size: 2rem; font-weight: bold; animation: floatUp 2s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        .rain-drop { position: absolute; width: 4px; height: 20px; background: linear-gradient(to bottom, transparent, #60a5fa); border-radius: 50%; animation: rainFall 1s linear forwards; }
        @keyframes rainFall { 0% { top: -20px; opacity: 1; } 100% { top: 400px; opacity: 0.3; } }
        .snow-flake { position: absolute; animation: snowFall 3s linear forwards; font-size: 1.5rem; }
        @keyframes snowFall { 0% { top: -40px; opacity: 1; } 100% { top: 400px; opacity: 0.2; } }
        .quiz-card { background: white; border-radius: 2rem; padding: 2rem; border: 8px solid #7dd3fc; box-shadow: 0 20px 60px rgba(59,130,246,0.3); max-width: 450px; margin: 0 auto; }
        .quiz-option { transition: all 0.2s; }
        .quiz-option:hover { transform: scale(1.03); }
        .correct { background: #bbf7d0 !important; border-color: #22c55e !important; }
        .wrong { background: #fecaca !important; border-color: #ef4444 !important; }
        .pulse-btn { animation: pulseGlow 1.5s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.5); } 50% { box-shadow: 0 0 0 10px rgba(147, 51, 234, 0); } }
        .highlight-yellow { background: linear-gradient(120deg, #fef08a 40%, #fef08a 100%); padding: 0 4px; border-radius: 4px; }
        .highlight-blue { background: linear-gradient(120deg, #bae6fd 40%, #bae6fd 100%); padding: 0 4px; border-radius: 4px; }
        .highlight-sky { background: linear-gradient(120deg, #e0f2fe 40%, #e0f2fe 100%); padding: 0 4px; border-radius: 4px; }
        .highlight-orange { background: linear-gradient(120deg, #fed7aa 40%, #fed7aa 100%); padding: 0 4px; border-radius: 4px; }
        @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        /* ── Difficulty badges ── */
        .diff-easy   { background: linear-gradient(135deg, #d1FAe5 0%, #6ee7b7 100%); border-color: #059669; color: #065f46; }
        .diff-medium { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); border-color: #d97706; color: #92400e; }
        .diff-hard   { background: linear-gradient(135deg, #fee2e2 0%, #fca5a5 100%); border-color: #dc2626; color: #7f1d1d; }
        .diff-badge { display: inline-block; padding: 4px 16px; border-radius: 999px; border-2 font-bold text-lg; }

        /* ── Quiz answer type toggles ── */
        .answer-type-btn { padding: 6px 14px; border-radius: 999px; border-2 font-bold transition-all; opacity: 0.5; }
        .answer-type-btn.active { opacity: 1; }
        .answer-type-btn:hover { opacity: 0.8; }

        /* ── Picto options (2x2 grid) ── */
        .picto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .picto-item { font-size: 3.5rem; padding: 16px; background: white; border: 4px solid #bae6fd; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .picto-item:hover { transform: scale(1.05); border-color: #7dd3fc; }
        .picto-item.correct { background: #bbf7d0; border-color: #22c55e; }
        .picto-item.wrong { background: #fecaca; border-color: #ef4444; }
        .picto-item.reveal-correct { background: #bbf7d0; border-color: #22c55e; animation: pulseGlow 0.8s ease-in-out 3; }

        /* ── Hint panel ── */
        .hint-panel { background: #fffbeb; border: 3px solid #f59e0b; border-radius: 1rem; padding: 12px 16px; margin-top: 10px; font-size: 1.1rem; color: #92400e; }
        .hint-panel.emotion { background: #fdf2f8; border-color: #db2777; color: #831843; }

        /* ── Certificate redesign ── */
        .cert-container { background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%); border: 8px solid #f59e0b; border-radius: 2rem; padding: 2rem; text-align: center; }
        .cert-seal { width: 80px; height: 80px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 0.8rem; margin: 1rem auto; }
        .concept-bar-wrap { background: #e5e7eb; border-radius: 999px; height: 24px; overflow: hidden; }
        .concept-bar { height: 100%; border-radius: 999px; transition: width 1s ease; }
        .concept-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .concept-icon { font-size: 1.8rem; flex-shrink: 0; }
        .concept-label { width: 80px; text-align: left; font-size: 1rem; }
        .concept-pct { width: 50px; text-align: right; font-weight: bold; }
        .concept-bar-col { flex: 1; }

        /* Feedback card tiers */
        .feedback-star { color: #f59e0b; font-size: 1.2rem; }

        /* Voice hint button */
        .voice-hint-btn { background: #fdf2f8; border: 3px solid #db2777; border-radius: 999px; padding: 8px 18px; font-size: 1.5rem; cursor: pointer; transition: transform 0.1s; }
        .voice-hint-btn:active { transform: scale(0.9); }

        /* Retry button */
        .retry-btn { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); border: 3px solid #d97706; border-radius: 999px; padding: 8px 20px; font-size: 1.2rem; cursor: pointer; transition: transform 0.1s; font-weight: bold; color: #92400e; }
        .retry-btn:hover { transform: scale(1.05); }
        .retry-btn:active { transform: scale(0.95); }

        /* History section */
        .history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: white/40; border-radius: 8px; margin-bottom: 6px; font-size: 0.95rem; }
        .history-date { color: #6b7280; font-size: 0.85rem; }
        .history-score { font-weight: bold; color: #059669; }
        .history-stars { color: #f59e0b; }
    </style>
</head>
<body>

    <!-- 登入頁面 -->
    <div id="landing-page">
        <div class="login-card">
            <h1 class="text-5xl font-bold text-sky-600 mb-4">🌦️ 氣象小魔術師</h1>
            <p class="text-xl text-gray-600 mb-6">水循環 ・ 分層學習系統</p>
            <div class="mb-5">
                <input type="text" id="student-name" placeholder="請輸入你的名字" class="w-full text-2xl p-4 border-4 border-sky-300 rounded-xl text-center placeholder-gray-300" aria-label="輸入名字">
            </div>
            <button id="btn-start" class="w-full bg-sky-500 text-white text-3xl font-bold py-4 rounded-xl shadow-lg border-b-8 border-sky-700 active:border-b-0 active:translate-y-2 transition-all" aria-label="開始冒險按鈕">開始冒險！🚀</button>
        </div>
    </div>

    <!-- 遊戲主畫面 -->
    <div id="game-container" class="hidden max-w-md mx-auto bg-white rounded-3xl shadow-xl p-5 border-4 border-sky-200 min-h-screen flex flex-col">
        <div class="text-center mb-3">
            <span class="text-lg text-gray-500">歡迎，<span id="display-name" class="font-bold text-sky-600"></span>！</span>
            <button id="speech-toggle" class="float-right text-2xl" aria-label="切換語音">🔇</button>
        </div>
        <h2 class="text-2xl font-bold text-center text-sky-700 mb-3">🌦️ 水循環實驗室</h2>
        <div id="status-text" class="text-center text-xl text-gray-600 mb-3 min-h-[60px]">選擇下面既魔法按鈕，變出天氣！</div>

        <!-- Canvas Area -->
        <div class="canvas-area flex items-end justify-center" id="display">
            <div id="ground-obj">🌱</div>
            <div id="puddle-obj">💧</div>
            <div id="sun-obj" class="hidden">☀️</div>
            <div id="cloud-obj" class="hidden">☁️</div>
        </div>

        <!-- 實驗按鈕區 -->
        <div class="grid grid-cols-3 gap-3 mt-4">
            <button id="btn-sun" class="magic-btn btn-sun text-2xl p-3 rounded-xl border-4 font-bold" role="button" aria-label="太陽按鈕">☀️ 太陽</button>
            <button id="btn-cloud" class="magic-btn btn-cloud text-2xl p-3 rounded-xl border-4 font-bold" role="button" aria-label="雲按鈕">☁️ 雲</button>
            <button id="btn-rain" class="magic-btn btn-rain text-2xl p-3 rounded-xl border-4 font-bold" role="button" aria-label="雨按鈕">🌧️ 雨</button>
            <button id="btn-snow" class="magic-btn btn-snow text-2xl p-3 rounded-xl border-4 font-bold" role="button" aria-label="雪按鈕">❄️ 雪</button>
            <button id="btn-dew" class="magic-btn btn-dew text-2xl p-3 rounded-xl border-4 font-bold" role="button" aria-label="露水按鈕">🍹 露水</button>
            <button id="btn-quiz" class="magic-btn btn-quiz text-xl p-3 rounded-xl border-4 font-bold bg-purple-100 text-purple-400 border-purple-200" role="button" aria-label="評估按鈕">📝 評估</button>
        </div>

        <!-- 評估區 -->
        <div id="quiz-section" class="hidden mt-5">
            <!-- Answer type selector -->
            <div class="flex justify-center gap-3 mb-4">
                <button class="answer-type-btn active" id="at-text" role="button" aria-label="文字答題模式">📝 字揀</button>
                <button class="answer-type-btn" id="at-pic" role="button" aria-label="圖片答題模式">🖼️ 圖揀</button>
                <button class="answer-type-btn" id="at-voice" role="button" aria-label="語音答題模式">🔊 聲音</button>
            </div>

            <div class="quiz-card">
                <div class="flex justify-between items-center mb-3">
                    <div id="quiz-progress" class="text-lg font-bold text-sky-600"></div>
                    <div id="quiz-score-live" class="text-lg font-bold text-amber-600"></div>
                </div>

                <!-- Difficulty badge -->
                <div class="text-center mb-3">
                    <span id="diff-badge" class="diff-badge diff-easy" role="status" aria-live="polite">🌱 易</span>
                    <span id="diff-label" class="text-base text-gray-500 ml-2">圖像配對 · 直接觀察</span>
                </div>

                <div id="quiz-question" class="text-xl font-bold text-gray-700 mb-4 text-center"></div>
                <div id="quiz-options" class="flex flex-col gap-2"></div>
                <div id="quiz-hint-area" class="hidden"></div>
                <div id="quiz-feedback" class="hidden mt-3 text-center text-lg font-bold"></div>
            </div>
        </div>

        <!-- 證書卡片 -->
        <div id="cert-card" class="hidden mt-5">
            <div class="cert-container">
                <div class="text-6xl mb-2">🎓</div>
                <h3 class="text-2xl font-bold text-amber-700 mb-2">🌦️ 氣象小魔術師 🌦️</h3>
                <p id="cert-name" class="text-xl font-bold text-gray-700 mb-2"></p>
                <p class="text-lg text-gray-600 mb-4">恭喜完成學習評估！</p>

                <!-- Overall score -->
                <div id="overall-score-wrap" class="mb-4">
                    <div class="text-5xl font-bold text-sky-700" id="cert-overall">0%</div>
                    <div class="text-base text-gray-500">總正確率</div>
                </div>

                <!-- Concept breakdown -->
                <div class="text-left bg-white/50 rounded-xl p-4 mb-4">
                    <p class="text-center text-xl font-bold text-sky-700 mb-3">📊 各概念學習進度</p>

                    <div class="concept-row">
                        <div class="concept-icon">☀️</div>
                        <div class="concept-label text-sm font-bold text-amber-700">蒸發</div>
                        <div class="concept-bar-col"><div class="concept-bar-wrap"><div class="concept-bar bg-amber-400" id="bar-evap" style="width:0%"></div></div></div>
                        <div class="concept-pct text-amber-600" id="pct-evap">0%</div>
                    </div>
                    <div class="concept-row">
                        <div class="concept-icon">☁️</div>
                        <div class="concept-label text-sm font-bold text-sky-700">凝結</div>
                        <div class="concept-bar-col"><div class="concept-bar-wrap"><div class="concept-bar bg-sky-400" id="bar-cond" style="width:0%"></div></div></div>
                        <div class="concept-pct text-sky-600" id="pct-cond">0%</div>
                    </div>
                    <div class="concept-row">
                        <div class="concept-icon">🌧️</div>
                        <div class="concept-label text-sm font-bold text-blue-700">降水</div>
                        <div class="concept-bar-col"><div class="concept-bar-wrap"><div class="concept-bar bg-blue-400" id="bar-preci" style="width:0%"></div></div></div>
                        <div class="concept-pct text-blue-600" id="pct-preci">0%</div>
                    </div>
                    <div class="concept-row">
                        <div class="concept-icon">🍹</div>
                        <div class="concept-label text-sm font-bold text-orange-700">露水</div>
                        <div class="concept-bar-col"><div class="concept-bar-wrap"><div class="concept-bar bg-orange-400" id="bar-dew" style="width:0%"></div></div></div>
                        <div class="concept-pct text-orange-600" id="pct-dew">0%</div>
                    </div>
                </div>

                <!-- Historical results -->
                <div id="history-section" class="hidden text-left bg-white/60 rounded-xl p-4 mb-4">
                    <p class="text-center text-lg font-bold text-sky-700 mb-3">📜 歷史記錄</p>
                    <div id="history-list"></div>
                </div>

                <!-- Precision feedback -->
                <div id="cert-feedback" class="text-left bg-white/60 rounded-xl p-4 mb-4 text-gray-700 text-base"></div>

                <!-- Stars rating -->
                <div id="cert-stars" class="text-3xl mb-3"></div>

                <div class="cert-seal" id="cert-seal-text">通過<br>認證</div>
                <p class="text-sm text-gray-500 mt-4">日期：<span id="cert-date"></span></p>
                <button id="btn-replay" class="mt-4 bg-sky-500 text-white px-6 py-3 rounded-xl font-bold" role="button" aria-label="再玩一次按鈕">好棒！再玩一次 ✨</button>
            </div>
        </div>
    </div>

<script>
(function() {
    var studentName = "";
    var progress = { sun: false, cloud: false, rain: false, snow: false, dew: false };
    var answerType = 'text'; // 'text' | 'pic' | 'voice'
    var currentQ = 0;
    var liveScore = 0;
    var hintUsed = false;
    var speechEnabled = true;

    // ── Per-concept tracking ──
    // Each question: { q, options, answer, concept, difficulty, hint, feedback_wrong }
    // difficulty: 0=易, 1=中, 2=難
    // concept: 'evap'|'cond'|'preci'|'dew'
    var allQuestions = [
        // ── 蒸發 evap ──
        { q: "☀️ 太陽曬吓曬吓，水會變成咩？", options: ["💧 水", "💨 水蒸氣", "❄️ 冰"], answer: 1, concept: 'evap', difficulty: 0, hint: "太陽公公熱辣辣，會將水變做氣體——叫做水蒸氣！💨", feedback: "記住啦！太陽熱辣辣，會將 💧水 變做 💨水蒸氣 走上去！" },
        { q: "☀️ 太陽係水循環入面扮咩角色？", options: ["🌧️ 落雨", "🔼 推動蒸發", "☁️ 整雲"], answer: 1, concept: 'evap', difficulty: 1, hint: "無太陽熱力，水就蒸發唔到～太陽係推動力！", feedback: "太阳係发动机，俾熱力推動水分走上天！" },
        { q: "🌊 水塘的水喺大太陽下慢慢消失哂，佢去咗邊？", options: ["☀️ 走入太陽度", "💨 變水蒸氣走上去天空", "🌧️ 變雨跌落嚟"], answer: 1, concept: 'evap', difficulty: 1, hint: "水塘變少但唔係消失——係變成我哋眼睇唔到既氣體！", feedback: "水塘既水變做水蒸氣，走上天空，等下次凝結再變雨！" },

        // ── 凝結 cond ──
        { q: "❄️ 水蒸氣升上天遇到凍，空氣會變成咩？", options: ["❄️ 雪", "💧 小水滴", "🔥 火"], answer: 1, concept: 'cond', difficulty: 0, hint: "暖空氣遇到凍空氣，就會變成一粒粒微小的水滴！💧", feedback: "暖空氣遇凍後收縮凝固，就變成 💧小水滴 啦！" },
        { q: "☁️ 雲係由啲咩组成既？", options: ["💨 風", "☀️ 太陽碎片", "💧 好細好細既水滴"], answer: 2, concept: 'cond', difficulty: 1, hint: "雲摸落去軟綿綿——其實係無數微小的水滴集合！", feedback: "雲既真身係無數 💧超細小既水滴 集合喺一起！" },
        { q: "🌡️ 高空為何比地面凍好多？", options: ["高空風大", "高空氣壓低 , 溫度下降", "高空無太陽"], answer: 1, concept: 'cond', difficulty: 2, hint: "氣壓低的地方溫度會話降就降——呢個係物理現象！", feedback: "氣壓低的地方溫度會急降，所以高空氣溫比地面凍好多！" },

        // ── 降水 preci ──
        { q: "🌧️ 雨係點樣形成既？", options: ["☀️ 太陽曬", "☁️ 入面既水滴太重 , 整唔住跌落嚟", "💨 風吹落嚟"], answer: 1, concept: 'preci', difficulty: 0, hint: "雲入面有好多水滴，越積越多太重，最後整唔住就跌落嚟！", feedback: "雲裡面既 💧水滴 越積越重，最後整唔住就 🌧️跌落嚟 雨就形成！" },
        { q: "❄️ 喺咩溫度先會落雪？", options: ["🔥 好熱時", "🥶 凍到大約0°C或以下", "☀️ 任何溫度都可以"], answer: 1, concept: 'preci', difficulty: 0, hint: "雪係冰嘅晶體——必須凍到一定溫度先整到！", feedback: "雪係冰雪既晶體，必須溫度低過 🥶0°C 先整得到！" },
        { q: "🌧️ 如果高空非常凍，雨滴會變成咩？", options: ["❄️ 雪", "💨 風", "☀️ 太陽"], answer: 0, concept: 'preci', difficulty: 1, hint: "雨係液態，但如果溫度再凍啲——液體變固體，就係雪！", feedback: "雨係液態 💧，溫度再凍就凝固變 ❄️雪 ——狀態改變！" },

        // ── 露水 dew ──
        { q: "🍹 喺咩天氣情況下最容易見到露水？", options: ["🔥 炎熱潮濕既夜晚", "🌲 大風時", "❄️ 最凍既冬天"], answer: 0, concept: 'dew', difficulty: 0, hint: "露水需要暖濕空氣接觸凍野——炎熱潮濕既夜晚最岩！", feedback: "炎熱潮濕既夜晚，暖空氣碰到地面/葉面等凍野，就凝結變 🍹露水！" },
        { q: "🍹 露水係點樣形成既？", options: ["🔥 高溫烤焗", "🌙 暖濕空氣遇冷 , 水氣凝結", "💨 強風吹出"], answer: 1, concept: 'dew', difficulty: 1, hint: "露水既關鍵字：暖空氣 + 凍野表面 = 凝結！", feedback: "記住公式：🌙暖濕空氣遇凍野 = 💧水氣凝結 = 🍹露水！" },
        { q: "🌿 點解早晨葉面會有露水但中午無？", options: ["葉面訓低咗", "夜晚地面散熱令葉面變凍 , 凝結水氣", "中午太忙無留意"], answer: 1, concept: 'dew', difficulty: 2, hint: "夜晚無太陽，地面同葉面散熱變凍，空氣既水分就黐埋一齊形成露水！", feedback: "夜晚地面散熱令葉面變凍，暖濕空氣黐上去就形成露水——呢個係凝結原理！" }
    ];

    // ── Per-concept pictogram grids ──
    var PICTO_GRIDS = {
        evap:   { icons: ['☀️','💧','💨','🔼'], labels: ['太陽','水','水蒸氣','上升'] },
        cond:   { icons: ['💨','☁️','❄️','💧'], labels: ['水蒸氣','雲','降溫','小水滴'] },
        preci:  { icons: ['☁️','🌧️','❄️','💧'], labels: ['雲','雨','雪','水滴'] },
        dew:    { icons: ['🌡️','🍃','💧','🌙'], labels: ['暖空氣','葉面','露水','夜晚'] }
    };

    // Build 12-question quiz: 3 questions per concept × 4 concepts = 12
    // Each concept: 1 easy(d0)+1 medium(d1)+1 hard(d2)
    function buildQuiz() {
        var qs = [];
        var concepts = ['evap','cond','preci','dew'];
        concepts.forEach(function(c) {
            var byConcept = allQuestions.filter(function(q){ return q.concept === c; });
            var easy = byConcept.filter(function(q){ return q.difficulty === 0; })[0];
            var medium = byConcept.filter(function(q){ return q.difficulty === 1; })[0];
            var hard = byConcept.filter(function(q){ return q.difficulty === 2; })[0];
            qs.push(easy, medium, hard);
        });
        // Shuffle
        for (var i = qs.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = qs[i]; qs[i] = qs[j]; qs[j] = tmp;
        }
        return qs;
    }
    var quizQuestions = buildQuiz();

    // Per-concept correct tracking
    var conceptCorrect = { evap: 0, cond: 0, preci: 0, dew: 0 };
    var conceptAttempts = { evap: 0, cond: 0, preci: 0, dew: 0 };

    // Retry tracking
    var retryCount = {};  // keyed by question index

    var landingPage, gameContainer, statusText, cloud, sun, display;

    // ── LocalStorage helpers ──
    var LS_KEY = 'scienceCert_results';

    function saveResult(name, score, total, ppt) {
        try {
            var results = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
            results.push({
                name: name,
                score: score,
                total: total,
                pct: Math.round((score / total) * 100),
                stars: Math.round((score / total) * 100) >= 90 ? 3 : Math.round((score / total) * 100) >= 60 ? 2 : 1,
                date: new Date().toLocaleString('zh-Hant'),
                ppt: ppt
            });
            // Keep last 10
            if (results.length > 10) results = results.slice(-10);
            localStorage.setItem(LS_KEY, JSON.stringify(results));
        } catch(e) {}
    }

    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem(LS_KEY) || '[]');
        } catch(e) { return []; }
    }

    function showHistory() {
        var hist = getHistory();
        if (hist.length === 0) return;

        var list = document.getElementById('history-list');

            list.appendChild(row);
        });
        el.classList.remove('hidden');
    }

            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-HK';

        } catch(e) {}
    }

    function clearPrecipitation() {

    function setAnswerType(type) {
        answerType = type;
        document.getElementById('at-text').classList.toggle('active', type === 'text');
        document.getElementById('at-pic').classList.toggle('active', type === 'pic');

    }

    function startQuiz() {
        conceptCorrect = { evap: 0, cond: 0, preci: 0, dew: 0 };
        conceptAttempts = { evap: 0, cond: 0, preci: 0, dew: 0 };
        retryCount = {};
        quizQuestions = buildQuiz(); // refresh shuffle
        currentQ = 0;
        liveScore = 0;
        answerType = 'text'; // default for SEN students
        document.getElementById('at-text').classList.add('active');
        document.getElementById('at-pic').classList.remove('active');
        document.getElementById('at-voice').classList.remove('active');
        document.getElementById('quiz-section').classList.remove('hidden');
        document.getElementById('cert-card').classList.add('hidden');
        renderQuestion(0);

    function diffBadge(d) {
        if (d === 0) return { cls: 'diff-easy',   label: '🌱 易', sub: '圖像配對 · 直接觀察' };
        if (d === 1) return { cls: 'diff-medium', label: '🌿 中', sub: '文字理解 · 基本推理' };
        return              { cls: 'diff-hard',   label: '🔥 難', sub: '應用題 · 深度理解' };
    }

    // Shuffle helper: Fisher-Yates
    function shuffleArr(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function renderQuestion(idx) {
        hintUsed = false;
        var q = quizQuestions[idx];
        var d = diffBadge(q.difficulty);
        document.getElementById('quiz-progress').innerText = '第 ' + (idx + 1) + ' 題 / ' + quizQuestions.length + ' 題';
        document.getElementById('quiz-score-live').innerText = '⭕ ' + liveScore + ' 分';
        document.getElementById('diff-badge').className = 'diff-badge ' + d.cls;
        document.getElementById('diff-badge').innerText = d.label;
        document.getElementById('diff-label').innerText = d.sub;
        document.getElementById('quiz-question').innerText = q.q;
        document.getElementById('quiz-hint-area').innerHTML = '';
        document.getElementById('quiz-hint-area').classList.add('hidden');
        document.getElementById('quiz-feedback').classList.add('hidden');

        var quizOptsEl = document.getElementById('quiz-options');
        quizOptsEl.innerHTML = '';

        if (answerType === 'pic') {
            renderPictoQuestion(q, quizOptsEl);
            return;
        }

        // Text or voice mode
        q.options.forEach(function(opt, idx) {
            var btn = document.createElement('button');
            var baseCls = 'w-full text-left text-xl p-4 rounded-xl border-4 border-sky-200 bg-sky-50 hover:bg-sky-100 transition-all font-bold mb-2';
            btn.className = baseCls;
            btn.innerHTML = opt;
            btn.setAttribute('aria-label', opt.replace(/[^\w\s]/g, ''));
            btn.addEventListener('click', (function(optIdx) {
                return function() { checkQuizAnswer(optIdx, q, btn, null); };
            })(idx));
            quizOptsEl.appendChild(btn);
        });

        // Voice mode: add hint button
        if (answerType === 'voice') {
            var hintBtn = document.createElement('button');
            hintBtn.className = 'voice-hint-btn mt-3 mx-auto block';
            hintBtn.innerHTML = '🔊 聽提示';
            hintBtn.setAttribute('aria-label', '播放語音提示');
            hintBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                speak(q.hint);
                var hintArea = document.getElementById('quiz-hint-area');
                hintArea.classList.remove('hidden');
                hintArea.innerHTML = '<div class="hint-panel emotion">' + q.hint + '</div>';
            });
            quizOptsEl.parentNode.insertBefore(hintBtn, quizOptsEl.nextSibling);
        }
    }

    function renderPictoQuestion(q, quizOptsEl) {
        var concept = q.concept;
        var gridDef = PICTO_GRIDS[concept] || PICTO_GRIDS.evap;
        var correctLabel = q.options[q.answer];

        // Build 4 items from grid definition
        var items = gridDef.icons.map(function(icon, i) {
            return { icon: icon, label: gridDef.labels[i] };
        });

        // Shuffle items
        var shuffled = shuffleArr(items);

        // Find shuffled position of correct answer
        var correctShuffledIdx = -1;
        for (var i = 0; i < 4; i++) {
            if (shuffled[i].label === correctLabel) {
                correctShuffledIdx = i;
                break;
            }
        }

        var gridEl = document.createElement('div');
        gridEl.className = 'picto-grid';

        shuffled.forEach(function(item, i) {
            var btn = document.createElement('div');
            btn.className = 'picto-item';
            btn.innerHTML = '<span>' + item.icon + '</span>';
            btn.setAttribute('role', 'button');
            btn.setAttribute('aria-label', item.label + ' 選項');
            btn.dataset.shuffledIdx = i;
            btn.dataset.isCorrect = (i === correctShuffledIdx) ? '1' : '0';
            btn.addEventListener('click', (function(shuffledIdx, isCorrect) {
                return function() {
                    checkPictoAnswer(shuffledIdx, isCorrect, q, gridEl.querySelectorAll('.picto-item'), correctShuffledIdx);
                };
            })(i, (i === correctShuffledIdx) ? '1' : '0'));
            gridEl.appendChild(btn);
        });

        quizOptsEl.appendChild(gridEl);

        // Change layout for picture mode
        document.getElementById('quiz-question').innerHTML = q.q + '<div class="text-sm text-gray-400 mt-1">點擊圖片作答</div>';
    }

    function checkPictoAnswer(selectedIdx, isCorrectFlag, qData, pictoItems, correctShuffledIdx) {
        // Disable all
        for (var i = 0; i < pictoItems.length; i++) {
            pictoItems[i].style.pointerEvents = 'none';
        }

        conceptAttempts[qData.concept]++;

        var wasCorrect = isCorrectFlag === '1';

        if (wasCorrect) {
            pictoItems[selectedIdx].classList.add('correct');
            liveScore += 10;
            conceptCorrect[qData.concept]++;
            document.getElementById('quiz-score-live').innerText = '⭕ ' + liveScore + ' 分';
            var fb = document.getElementById('quiz-feedback');
            fb.classList.remove('hidden');
            fb.className = 'mt-3 text-center text-xl font-bold text-green-600';
            fb.innerText = '✅ 答啱啦！';
            speak('答啱了！好嘢！');
            setTimeout(function() { advanceQuestion(); }, 1200);
        } else {
            pictoItems[selectedIdx].classList.add('wrong');
            // Highlight correct
            if (correctShuffledIdx !== null && correctShuffledIdx >= 0) {
                pictoItems[correctShuffledIdx].classList.add('reveal-correct');
            }
            showWrongFeedback(qData);
        }
    }

    function checkQuizAnswer(selected, qData, btnEl, pictoItems) {
        var correct = qData.answer;

        conceptAttempts[qData.concept]++;

        var quizOptsEl = document.getElementById('quiz-options');
        var allBtns = quizOptsEl.querySelectorAll('button:not(.voice-hint-btn):not(.retry-btn):not(.skip-btn)');

        var isCorrect = (selected === correct);

        // Disable all
        for (var i = 0; i < allBtns.length; i++) { allBtns[i].style.pointerEvents = 'none'; }

        if (isCorrect) {
            if (btnEl) btnEl.classList.add('correct');
            liveScore += 10;
            conceptCorrect[qData.concept]++;
            document.getElementById('quiz-score-live').innerText = '⭕ ' + liveScore + ' 分';
            var fb = document.getElementById('quiz-feedback');
            fb.classList.remove('hidden');
            fb.className = 'mt-3 text-center text-xl font-bold text-green-600';
            fb.innerText = '✅ 答啱啦！';
            speak('答啱了！好嘢！');
            setTimeout(function() { advanceQuestion(); }, 1200);
        } else {
            if (btnEl) btnEl.classList.add('wrong');
            // Show correct
            if (allBtns[correct]) allBtns[correct].classList.add('correct');
            showWrongFeedback(qData);
        }
    }

    function showWrongFeedback(qData) {
        var fb = document.getElementById('quiz-feedback');
        fb.classList.remove('hidden');
        fb.className = 'mt-3 text-center text-lg font-bold text-red-500';
        fb.innerHTML = '❌ ' + qData.feedback;
        speak(qData.feedback);

        var qIdx = currentQ;
        var retries = retryCount[qIdx] || 0;

        if (retries < 2) {
            // Show retry button
            var retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn mx-auto mt-3 block';
            retryBtn.innerHTML = '🔄 再試一次';
            retryBtn.setAttribute('aria-label', '再試一次');
            retryBtn.addEventListener('click', function() {
                retryCount[qIdx] = retries + 1;
                fb.classList.add('hidden');
                renderQuestion(qIdx);
            });
            fb.parentNode.appendChild(retryBtn);
        } else {
            // Show skip link after 2 retries used
            var skipLink = document.createElement('button');
            skipLink.className = 'skip-btn mx-auto mt-2 block text-sm text-gray-500 underline';
            skipLink.innerHTML = '跳過呢題 ➜';
            skipLink.setAttribute('aria-label', '跳過這題');
            skipLink.addEventListener('click', function() {
                fb.classList.add('hidden');
                advanceQuestion();
            });
            fb.parentNode.appendChild(skipLink);
        }
    }

    function advanceQuestion() {
        currentQ++;
        if (currentQ >= quizQuestions.length) {
            showCert();
            return;
        }
        renderQuestion(currentQ);
    }

    function showCert() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('cert-card').classList.remove('hidden');
        document.getElementById('cert-name').innerText = studentName + '，恭喜你完成學習評估！';
        document.getElementById('cert-date').innerText = new Date().toLocaleDateString('zh-Hant');

        // Calculate %
        var totalAttempts = quizQuestions.length; // 12
        var totalCorrect = conceptCorrect.evap + conceptCorrect.cond + conceptCorrect.preci + conceptCorrect.dew;
        var overallPct = Math.round((totalCorrect / totalAttempts) * 100);

        document.getElementById('cert-overall').innerText = overallPct + '%';

        // Per-concept %
        var ppt = {
            evap:   conceptAttempts.evap   > 0 ? Math.round(conceptCorrect.evap   / conceptAttempts.evap   * 100) : 0,
            cond:   conceptAttempts.cond   > 0 ? Math.round(conceptCorrect.cond   / conceptAttempts.cond   * 100) : 0,
            preci: conceptAttempts.preci > 0 ? Math.round(conceptCorrect.preci / conceptAttempts.preci * 100) : 0,
            dew:   conceptAttempts.dew   > 0 ? Math.round(conceptCorrect.dew   / conceptAttempts.dew   * 100) : 0
        };

        document.getElementById('pct-evap').innerText   = ppt.evap   + '%';
        document.getElementById('pct-cond').innerText   = ppt.cond   + '%';
        document.getElementById('pct-preci').innerText = ppt.preci + '%';
        document.getElementById('pct-dew').innerText   = ppt.dew   + '%';
        document.getElementById('bar-evap').style.width   = ppt.evap   + '%';
        document.getElementById('bar-cond').style.width   = ppt.cond   + '%';
        document.getElementById('bar-preci').style.width = ppt.preci + '%';
        document.getElementById('bar-dew').style.width   = ppt.dew   + '%';

        // Stars: 1-3 stars based on overall %
        var stars = overallPct >= 90 ? 3 : overallPct >= 60 ? 2 : 1;
        var starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        document.getElementById('cert-stars').innerHTML = '<span class="feedback-star">' + starStr + '</span>';

        // Precision feedback per concept
        var feedbacks = [];
        if (ppt.evap < 60)   feedbacks.push('☀️ <b>蒸發</b>要再記多啲——記住「太陽熱辣辣，水變水蒸氣」呢個公式！');
        if (ppt.cond < 60)   feedbacks.push('☁️ <b>凝結</b>要再练——暖空氣遇冷就變成小水滴！');
        if (ppt.preci < 60)  feedbacks.push('🌧️ <b>降水</b>要再加强——雨/雪都係雲裡面的水滴太重跌落嚟！');
        if (ppt.dew < 60)     feedbacks.push('🍹 <b>露水</b>要再記——暖濕空氣碰到凍野表面就凝結成露水！');

        if (feedbacks.length === 0) {
            feedbacks.push('🌟 <b>太棒了！</b>你對水循環已完全掌握，所有概念都明白晒！繼續保持！');
        } else {
            feedbacks.unshift('💪 <b>老師既提醒：</b>以下概念需要再鞏固——');
        }
        document.getElementById('cert-feedback').innerHTML = feedbacks.join('<br>');

        // Seal text: based on score
        var sealEl = document.getElementById('cert-seal-text');
        if (overallPct >= 90) {
            sealEl.innerHTML = '優異<br>認證';
            sealEl.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        } else if (overallPct >= 60) {
            sealEl.innerHTML = '通過<br>認證';
            sealEl.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        } else {
            sealEl.innerHTML = '繼續<br>努力';
            sealEl.style.background = 'linear-gradient(135deg, #94a3b8, #64748b)';
        }

        // Save to localStorage
        saveResult(studentName, totalCorrect, totalAttempts, ppt);

        // Show history
        showHistory();

        createConfetti();
    }

    function createConfetti() {
        var colors = ['#facc15','#fb923c','#34d399','#60a5fa','#a78bfa','#f472b6'];
        for (var i = 0; i < 50; i++) {
            var c = document.createElement('div');
            c.style.cssText = 'position:fixed;top:-20px;left:' + Math.random()*100 + 'vw;width:10px;height:10px;background:' + colors[Math.floor(Math.random()*6)] + ';border-radius:2px;z-index:9999;pointer-events:none;animation:confetti-fall ' + (1+Math.random()*2) + 's linear forwards';
            document.body.appendChild(c);
            setTimeout(function(el){ el.remove(); }, 4000, c);
        }
    }

    function bindButtons() {
        document.getElementById('btn-start').addEventListener('click', enterGame);
        document.getElementById('student-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') enterGame();
        });
        document.getElementById('btn-sun').addEventListener('click', makeSun);
        document.getElementById('btn-cloud').addEventListener('click', makeCloud);
        document.getElementById('btn-rain').addEventListener('click', makeRain);
        document.getElementById('btn-snow').addEventListener('click', makeSnow);
        document.getElementById('btn-dew').addEventListener('click', makeDew);
        document.getElementById('btn-quiz').addEventListener('click', startQuiz);
        document.getElementById('btn-replay').addEventListener('click', function() { location.reload(); });

        document.getElementById('speech-toggle').addEventListener('click', function() {
            speechEnabled = !speechEnabled;
            this.innerText = speechEnabled ? '🔇' : '🔊';
        });

        // Answer type buttons - removed inline onclick, using addEventListener
        document.getElementById('at-text').addEventListener('click', function() { setAnswerType('text'); });
        document.getElementById('at-pic').addEventListener('click', function() { setAnswerType('pic'); });
        document.getElementById('at-voice').addEventListener('click', function() { setAnswerType('voice'); });

        landingPage = document.getElementById('landing-page');
        gameContainer = document.getElementById('game-container');
        statusText = document.getElementById('status-text');
        cloud = document.getElementById('cloud-obj');
        sun = document.getElementById('sun-obj');
        display = document.getElementById('display');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindButtons);
    } else {
        bindButtons();
    }
})();
</script>
</body>
</html>
